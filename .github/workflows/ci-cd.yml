name: EVCP Booking Service CI/CD

# ── Trigger: on every push and pull request to develop and main ──
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write   # required to push images to GitHub Container Registry (ghcr.io)

env:
  IMAGE_NAME: ghcr.io/raks-rak57/evcp-booking-service

jobs:
  # ───────────────────────── STAGE 1: BUILD & UNIT TEST ─────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ───────────────────── STAGE 2: CODE QUALITY ANALYSIS ─────────────────────
  code-quality:
    name: Code Quality (ESLint)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run ESLint
        run: npm run lint

  # ───────────────────────── STAGE 3: SECURITY SCANNING ─────────────────────────
  security-scan:
    name: Security Scan (npm audit)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true   # report but don't block pipeline at this maturity stage

  # ─────────────────── STAGE 4: PACKAGE (Docker build + scan) ───────────────────
  package:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t evcp-booking-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.13.0
        with:
          image-ref: "evcp-booking-service:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # report only; set to "1" to hard-fail the pipeline once triaged

  # ───────── STAGE 5: PUBLISH IMAGE (CD begins here — main/develop only) ─────────
  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}

  # ───────────────────── STAGE 6: DEPLOY TO STAGING (develop) ─────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.evcp.example.com
    steps:
      - name: Deploy image to staging environment
        run: |
          echo "Deploying ${{ env.IMAGE_NAME }}:${{ github.sha }} to STAGING"
          echo "(In a provisioned environment this pulls the image and restarts the staging container/service.)"

  # ─────────────── STAGE 7: DEPLOY TO PRODUCTION (main, manual approval) ───────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment:
      name: production   # configure required reviewers on this environment in repo Settings
      url: https://evcp.example.com
    steps:
      - name: Deploy image to production environment
        run: |
          echo "Deploying ${{ env.IMAGE_NAME }}:${{ github.sha }} to PRODUCTION"
          echo "Previous stable tag remains available at ${{ env.IMAGE_NAME }}:<previous-sha> for rollback."
